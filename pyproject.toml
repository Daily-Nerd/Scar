[project]
name = "scar-cli"
version = "0.21.0"
description = "SCAR — version control for negative knowledge (deadends, fences, landmines)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
]

[project.scripts]
scar = "scar.cli:main"

[project.optional-dependencies]
symbols = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scar"]

[dependency-groups]
# ruff is pinned, not floated: a version skew between CI and a contributor's
# machine produces contradictory verdicts on the same code. Bump it here and
# in .pre-commit-config.yaml together.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.5"]

[tool.ruff.lint]
# The classic default rule set, stated EXPLICITLY. Ruff's built-in default has
# widened over releases (0.16.5 reports 105 findings here with no config vs 31
# under this set), so relying on the implicit default means a ruff upgrade
# silently changes what CI enforces. Widening is a deliberate, reviewable diff.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
