name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          # config-file + manifest replace the inline release-type so extra-files
          # can keep plugin/plugin.json's version in lock-step with pyproject (#62).
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: astral-sh/setup-uv@v5

      # release-please bumps pyproject.toml but has no uv.lock updater, so the
      # lock kept drifting until some unrelated PR happened to re-lock it (#220).
      # The branch name is a release-please convention, derived rather than
      # parsed out of the action's JSON output so this does not break if that
      # output schema changes.
      #
      # This push DOES create a new head SHA, so the release PR's checks
      # re-arm behind the run-approval gate (scar 0015) and need another
      # approve-click. That is not a cost this step adds: release-please's own
      # commit parks the same way, so the gate fires with or without the sync
      # and the net remains one click on the final SHA. Observed 2026-08-28 —
      # sync commit a65c956 produced three runs at conclusion action_required.
      - name: Sync uv.lock on the release PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=release-please--branches--main
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "No open release branch — nothing to sync."
            exit 0
          fi
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in step with pyproject.toml."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with the release version"
          git push origin "$BRANCH"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
